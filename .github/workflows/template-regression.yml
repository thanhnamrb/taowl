name: Original-template regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/visual-header-footer-continuous-table

permissions:
  contents: read

jobs:
  docx-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile app
        run: python -m py_compile app.py
      - name: Test original LingualXplore template
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Inspect original DOCX layout
        run: python tools/layout_diagnostics.py

      - name: Install PDF render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer >/dev/null
          python -m pip install pymupdf
      - name: Render and inspect original template pages
        run: python tools/render_qa.py
      - name: Upload visual QA preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taowl-template-visual-qa
          path: qa_output/
          retention-days: 14
